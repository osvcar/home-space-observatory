<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission 001 — First Light: Jupiter</title>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/mission-001.css">
</head>

<body>
  <main class="mission-page">

    <section class="mission-section">
      <h2>Capture data</h2>

      <dl class="data-grid">
        <div class="data-item"><dt>Camera</dt><dd id="camera"></dd></div>
        <div class="data-item"><dt>Focal length</dt><dd id="focal"></dd></div>
        <div class="data-item"><dt>ISO</dt><dd id="iso"></dd></div>
        <div class="data-item"><dt>Exposure</dt><dd id="exposure"></dd></div>
        <div class="data-item"><dt>Aperture</dt><dd id="aperture"></dd></div>
        <div class="data-item"><dt>Capture date</dt><dd id="date"></dd></div>
        <div class="data-item"><dt>Frames captured</dt><dd id="frames"></dd></div>
        <div class="data-item"><dt>Capture mode</dt><dd id="mode"></dd></div>
        <div class="data-item"><dt>Flash</dt><dd id="flash"></dd></div>
      </dl>
    </section>

  </main>

  <script src="../../assets/js/mission-loader.js"></script>
</body>
</html>
